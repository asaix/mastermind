name: release

on:
  push:
    branches:
      - main

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CC=gcc-14

      - name: Package
        run: |
          mkdir mastermind-linux-x86_64
          cp mastermind install.sh uninstall.sh README.md LICENSE mastermind-linux-x86_64/
          tar -czf mastermind-linux-x86_64.tar.gz mastermind-linux-x86_64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "mastermind-${GITHUB_SHA::7}" mastermind-linux-x86_64.tar.gz --target "$GITHUB_SHA" --generate-notes
