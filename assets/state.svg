<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" width="1100" height="950" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>mastermind state machines</title>
  <style>
    .bg { fill: #ffffff; }
    .st rect { fill: #f3f4f6; stroke: #374151; stroke-width: 1.5; }
    .st text { fill: #111827; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
    .h { fill: #111827; font-size: 15px; font-weight: 700; }
    .sub { fill: #6b7280; font-size: 12px; }
    .ev { fill: #111827; font-size: 11.5px; text-anchor: middle; }
    .ac { fill: #6b7280; font-size: 11px; font-style: italic; text-anchor: middle; }
    .rl { fill: #b91c1c; font-size: 11px; text-anchor: middle; }
    .sep { stroke: #d1d5db; stroke-width: 1; }
    .e { fill: none; stroke-width: 1.6; }
    .blue { stroke: #2563eb; } .blue-f { fill: #2563eb; }
    .green { stroke: #059669; } .green-f { fill: #059669; }
    .red { stroke: #dc2626; stroke-dasharray: 5 4; } .red-f { fill: #dc2626; }
    .gray { stroke: #4b5563; } .gray-f { fill: #4b5563; }
    .purple { stroke: #7c3aed; } .purple-f { fill: #7c3aed; }
    .ig rect { fill: #ede9fe; stroke: #7c3aed; }
    .lg { fill: #374151; font-size: 11.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .st rect { fill: #161b22; stroke: #8b949e; }
      .st text, .h, .ev { fill: #e6edf3; }
      .sub, .ac { fill: #8b949e; }
      .rl { fill: #ff7b72; }
      .sep { stroke: #30363d; }
      .blue { stroke: #58a6ff; } .blue-f { fill: #58a6ff; }
      .green { stroke: #3fb950; } .green-f { fill: #3fb950; }
      .red { stroke: #f85149; } .red-f { fill: #f85149; }
      .gray { stroke: #8b949e; } .gray-f { fill: #8b949e; }
      .purple { stroke: #bc8cff; } .purple-f { fill: #bc8cff; }
      .ig rect { fill: #251a3d; stroke: #bc8cff; }
      .lg { fill: #c9d1d9; }
    }
  </style>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="blue-f" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="green-f" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="red-f" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="gray-f" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="purple-f" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="950"/>

  <!-- ============ Panel 1: lobby and challenge handshake ============ -->
  <text x="30" y="26"><tspan class="h">Lobby &amp; challenge handshake</tspan><tspan class="sub" dx="16">challenge.c · enum mode</tspan></text>

  <!-- failure rails (drawn first so states sit on top) -->
  <path class="e red" d="M810 100 V60 H60 V208" marker-end="url(#a-red)"/>
  <path class="e red" d="M310 100 V60"/>
  <path class="e red" d="M560 100 V60"/>
  <text class="rl" x="440" y="52">connect fails · recv NAH or BUSY · peer disconnects · 10 s timeout</text>

  <path class="e red" d="M430 360 V400 H60 V252" marker-end="url(#a-red)"/>
  <path class="e red" d="M680 360 V400 H430"/>
  <text class="rl" x="370" y="418">challenger disconnects · typed no (send NAH) · 10 s timeout</text>

  <!-- outgoing: we challenge someone -->
  <path class="e blue" d="M90 210 V120 H248" marker-end="url(#a-blue)"/>
  <text class="ev" x="170" y="112">typed challenge &lt;ID&gt;</text>
  <text class="ac" x="170" y="136">non-blocking connect()</text>

  <path class="e blue" d="M370 120 H498" marker-end="url(#a-blue)"/>
  <text class="ev" x="435" y="112">connect done</text>
  <text class="ac" x="435" y="136">(POLLOUT)</text>

  <path class="e blue" d="M620 120 H748" marker-end="url(#a-blue)"/>
  <text class="ev" x="685" y="112">recv WHO ARE YOU</text>
  <text class="ac" x="685" y="136">send name + port</text>

  <path class="e blue" d="M870 120 H1020 V208" marker-end="url(#a-blue)"/>
  <text class="ev" x="945" y="112">recv OK</text>
  <text class="ac" x="945" y="136">we play mastermind</text>

  <!-- incoming: someone challenges us -->
  <path class="e green" d="M90 250 V340 H368" marker-end="url(#a-green)"/>
  <text class="ev" x="230" y="332">incoming connection</text>
  <text class="ac" x="230" y="356">send WHO ARE YOU</text>

  <path class="e green" d="M490 340 H618" marker-end="url(#a-green)"/>
  <text class="ev" x="555" y="332">recv name + port</text>
  <text class="ac" x="555" y="356">ask accept? (yes/no)</text>

  <path class="e green" d="M740 340 H1020 V252" marker-end="url(#a-green)"/>
  <text class="ev" x="880" y="332">typed yes</text>
  <text class="ac" x="880" y="356">send OK; we play codebreaker</text>

  <!-- back to the lobby after a game -->
  <path class="e purple" d="M1050 252 V450 H14 V230 H28" marker-end="url(#a-purple)"/>
  <text class="ev" x="540" y="468">after the game ends or the opponent leaves, press enter to return to the lobby (challenge_end_game)</text>

  <!-- states -->
  <g class="st"><rect x="30" y="210" width="120" height="40" rx="8"/><text x="90" y="234">IDLE</text></g>
  <g class="st"><rect x="250" y="100" width="120" height="40" rx="8"/><text x="310" y="124">CONNECTING</text></g>
  <g class="st"><rect x="500" y="100" width="120" height="40" rx="8"/><text x="560" y="124">WAIT_WHO</text></g>
  <g class="st"><rect x="750" y="100" width="120" height="40" rx="8"/><text x="810" y="124">WAIT_REPLY</text></g>
  <g class="st"><rect x="370" y="320" width="120" height="40" rx="8"/><text x="430" y="344">WAIT_ID</text></g>
  <g class="st"><rect x="620" y="320" width="120" height="40" rx="8"/><text x="680" y="344">PROMPT</text></g>
  <g class="st ig"><rect x="960" y="210" width="120" height="40" rx="8"/><text x="1020" y="234">IN_GAME</text></g>

  <!-- legend -->
  <line class="e blue" x1="30" y1="496" x2="58" y2="496"/>
  <text class="lg" x="64" y="500">we challenged</text>
  <line class="e green" x1="170" y1="496" x2="198" y2="496"/>
  <text class="lg" x="204" y="500">we were challenged</text>
  <line class="e red" x1="335" y1="496" x2="363" y2="496"/>
  <text class="lg" x="369" y="500">abort to IDLE</text>
  <text class="sub" x="480" y="500">Outside IDLE, any other incoming connection gets WHO ARE YOU, then BUSY, and is closed.</text>

  <line class="sep" x1="20" y1="522" x2="1080" y2="522"/>

  <!-- ============ Panel 2: mastermind ============ -->
  <text x="30" y="550"><tspan class="h">Mastermind side</tspan><tspan class="sub" dx="16">master.c · the challenger sets the code and scores each guess by hand</tspan></text>

  <path class="e red" d="M90 640 V685 H1010 V642" marker-end="url(#a-red)"/>
  <path class="e red" d="M390 640 V685"/>
  <path class="e red" d="M690 640 V685"/>
  <text class="rl" x="550" y="702">send or recv fails · codebreaker disconnects</text>

  <path class="e gray" d="M150 620 H328" marker-end="url(#a-gray)"/>
  <text class="ev" x="240" y="612">typed 5-digit code</text>
  <text class="ac" x="240" y="636">send READY</text>

  <path class="e gray" d="M450 610 H628" marker-end="url(#a-gray)"/>
  <text class="ev" x="540" y="602">recv GUESS:&lt;g&gt;</text>

  <path class="e gray" d="M630 630 H452" marker-end="url(#a-gray)"/>
  <text class="ev" x="540" y="646">typed feedback (x o -)</text>
  <text class="ac" x="540" y="660">send FEEDBACK:&lt;fb&gt;</text>

  <path class="e gray" d="M750 620 H948" marker-end="url(#a-gray)"/>
  <text class="ev" x="850" y="612">typed xxxxx, or 12th guess</text>
  <text class="ac" x="850" y="636">send FEEDBACK, REVEAL; close</text>

  <g class="st"><rect x="30" y="600" width="120" height="40" rx="8"/><text x="90" y="624">SECRET</text></g>
  <g class="st"><rect x="330" y="600" width="120" height="40" rx="8"/><text x="390" y="624">GUESS</text></g>
  <g class="st"><rect x="630" y="600" width="120" height="40" rx="8"/><text x="690" y="624">FEEDBACK</text></g>
  <g class="st ig"><rect x="950" y="600" width="120" height="40" rx="8"/><text x="1010" y="624">GAME_OVER</text></g>

  <line class="sep" x1="20" y1="730" x2="1080" y2="730"/>

  <!-- ============ Panel 3: codebreaker ============ -->
  <text x="30" y="758"><tspan class="h">Codebreaker side</tspan><tspan class="sub" dx="16">breaker.c · the challenged player gets 12 guesses</tspan></text>

  <path class="e red" d="M90 865 V905 H1010 V867" marker-end="url(#a-red)"/>
  <path class="e red" d="M390 865 V905"/>
  <path class="e red" d="M690 865 V905"/>
  <text class="rl" x="550" y="922">send or recv fails · mastermind disconnects before REVEAL</text>

  <path class="e gray" d="M390 825 V784 H1010 V823" marker-end="url(#a-gray)"/>
  <text class="ev" x="700" y="776">recv REVEAL:&lt;code&gt;, which arrives right after the last FEEDBACK</text>

  <path class="e gray" d="M150 845 H328" marker-end="url(#a-gray)"/>
  <text class="ev" x="240" y="837">recv READY</text>

  <path class="e gray" d="M450 835 H628" marker-end="url(#a-gray)"/>
  <text class="ev" x="540" y="813">typed 5-digit guess</text>
  <text class="ac" x="540" y="827">send GUESS:&lt;g&gt;</text>

  <path class="e gray" d="M630 855 H452" marker-end="url(#a-gray)"/>
  <text class="ev" x="540" y="871">recv FEEDBACK:&lt;fb&gt;</text>

  <g class="st"><rect x="30" y="825" width="120" height="40" rx="8"/><text x="90" y="849">WAIT_SECRET</text></g>
  <g class="st"><rect x="330" y="825" width="120" height="40" rx="8"/><text x="390" y="849">ENTER_GUESS</text></g>
  <g class="st"><rect x="630" y="825" width="120" height="40" rx="8"/><text x="690" y="849">WAIT_FEEDBACK</text></g>
  <g class="st ig"><rect x="950" y="825" width="120" height="40" rx="8"/><text x="1010" y="849">GAME_OVER</text></g>
</svg>
